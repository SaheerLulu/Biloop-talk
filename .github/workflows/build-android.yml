name: Build Talk Android (APK)

# Builds the Nextcloud Talk Android client (rebranded as Biloop Talk) into an
# installable APK and publishes it to the "android-latest" GitHub Release.
# Android builds run on Linux, so no special OS is required.

on:
  push:
    branches:
      - claude/nextcloud-talk-desktop-app-T3xzi
    paths:
      - '.github/workflows/build-android.yml'
      - 'scripts/build-android.sh'
      - 'scripts/apply-branding-android.sh'
      - 'branding/android/**'
      - 'branding/branding.json'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream branch/tag of nextcloud/talk-android (blank = default branch)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out build repo
        uses: actions/checkout@v4

      - name: Check out upstream Talk Android source
        uses: actions/checkout@v4
        with:
          repository: nextcloud/talk-android
          ref: ${{ github.event.inputs.ref }}
          path: upstream-android
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK packages (compileSdk 36)
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build Talk Android (branded)
        shell: bash
        run: bash scripts/build-android.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: biloop-talk-android
          if-no-files-found: warn
          retention-days: 14
          path: upstream-android/app/build/outputs/apk/**/*.apk

  release:
    name: Publish APK to a Release
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect APKs
        id: collect
        shell: bash
        run: |
          mkdir -p release
          # Rename to a friendly, stable asset name.
          i=0
          while IFS= read -r apk; do
            cp -v "$apk" "release/Biloop.Talk-android.apk"
            i=$((i+1))
          done < <(find artifacts -type f -name '*.apk' | sort)
          echo "--- release/ ---"; ls -la release || true
          count=$(find release -type f | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Publish/Update "android-latest" release
        if: steps.collect.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="android-latest"
          TITLE="Biloop Talk — Android APK (build ${{ github.run_number }})"
          NOTES="Automated build from \`${{ github.sha }}\` on $(date -u +%Y-%m-%dT%H:%MZ).
          Debug-signed 'generic' APK (no Google services) — enable 'Install unknown apps' to sideload."
          gh release delete "$TAG" --repo "${{ github.repository }}" --cleanup-tag --yes || true
          gh release create "$TAG" release/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.ref_name }}" \
            --title "$TITLE" \
            --notes "$NOTES"
          echo "Published: $(gh release view "$TAG" --repo "${{ github.repository }}" --json url -q .url)"
