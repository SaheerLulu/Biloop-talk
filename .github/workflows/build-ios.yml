name: Build Talk iOS (unsigned IPA)

# Builds the Nextcloud Talk iOS client (rebranded as Biloop Talk) into an
# UNSIGNED .ipa on macOS and publishes it to the "ios-latest" GitHub Release.
#
# NOTE: an unsigned .ipa cannot be installed from the App Store. It can be
# sideloaded with tools that re-sign it (AltStore / Sideloadly) or re-signed
# with an Apple Developer certificate. Producing a directly-installable build
# requires Apple signing credentials (add them as secrets to enable that).

on:
  push:
    branches:
      - claude/nextcloud-talk-desktop-app-T3xzi
    paths:
      - '.github/workflows/build-ios.yml'
      - 'scripts/build-ios.sh'
      - 'scripts/apply-branding-ios.sh'
      - 'branding/ios/**'
      - 'branding/branding.json'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream branch/tag of nextcloud/talk-ios (blank = default branch)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Check out build repo
        uses: actions/checkout@v4

      - name: Check out upstream Talk iOS source
        uses: actions/checkout@v4
        with:
          repository: nextcloud/talk-ios
          ref: ${{ github.event.inputs.ref }}
          path: upstream-ios
          submodules: recursive

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Talk iOS (branded, unsigned)
        shell: bash
        env:
          TALK_IOS_REF: ${{ github.event.inputs.ref || 'main' }}
        run: bash scripts/build-ios.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: biloop-talk-ios
          if-no-files-found: warn
          retention-days: 14
          path: upstream-ios/build/*.ipa

  release:
    name: Publish IPA to a Release
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect IPA
        id: collect
        shell: bash
        run: |
          mkdir -p release
          while IFS= read -r ipa; do
            cp -v "$ipa" "release/Biloop.Talk-ios-unsigned.ipa"
          done < <(find artifacts -type f -name '*.ipa' | sort)
          count=$(find release -type f | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Publish/Update "ios-latest" release
        if: steps.collect.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="ios-latest"
          TITLE="Biloop Talk — iOS (unsigned, build ${{ github.run_number }})"
          NOTES="Automated build from \`${{ github.sha }}\` on $(date -u +%Y-%m-%dT%H:%MZ).
          UNSIGNED .ipa — sideload with AltStore/Sideloadly (which re-sign) or re-sign with an Apple Developer certificate. Not installable directly from the App Store."
          gh release delete "$TAG" --repo "${{ github.repository }}" --cleanup-tag --yes || true
          gh release create "$TAG" release/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.ref_name }}" \
            --title "$TITLE" \
            --notes "$NOTES"
          echo "Published: $(gh release view "$TAG" --repo "${{ github.repository }}" --json url -q .url)"
